# =============================
# Global configuration for pipeline
# =============================

data:
  path: 'ml_ready_data.csv'   # Using the processed CSV data
  sheet_name: 'Sheet1'
  index_col: null
# -----------------------------
# Regression targets
# -----------------------------
targets:
  - thermal_efficiency_cold_start    # Individual thermal efficiency (cold start)
  - thermal_efficiency_hot_start     # Individual thermal efficiency (hot start)
  - thermal_efficiency_simmer        # Individual thermal efficiency (simmer)
  - average_efficiency               # Main target: average of the three thermal efficiencies


# -----------------------------
# Preprocessing options
# -----------------------------
preprocess:
  drop_na_threshold_col: 0.6       # drop columns with >40% missing
  drop_na_threshold_row: 0.6       # drop rows with >40% missing
  impute_strategy: median          # mean | median | most_frequent
  scale: minmax                  # standard | minmax
  remove_near_constant: true
  variance_threshold: 0.0

# -----------------------------
# Dimensionality reduction
# -----------------------------
dim_reduce:
  method: pca
  n_components: 0.95      # keep 95% variance (often 10–40 comps)

# For visualization, we'll also compute t-SNE and UMAP embeddings
visualization:
  create_tsne: true       # Create t-SNE visualizations
  tsne_perplexity: 30
  create_umap: true       # Create UMAP visualizations
  umap_n_neighbors: 15
  umap_min_dist: 0.1

# -----------------------------
# Clustering
# -----------------------------
clustering:
  algorithm: kmeans        # or: kmeans / dbscan / gmm
  kmeans_k_range: [2, 8]   # search K using silhouette score
  gmm_k_range: [2, 8]
  covariance_type: full

  # ---- DBSCAN options ----
  dbscan:
    eps: 0.5
    min_samples: 10

  # Metric used to pick best algorithm if auto mode
  selection_metric: silhouette     # silhouette | calinski_harabasz | davies_bouldin

# -----------------------------
# Regression
# -----------------------------
regression:
  enabled: true
  models:  # Train multiple models for comparison
    - linear           # Linear Regression
    - random_forest    # Random Forest Regressor
    - xgboost          # XGBoost Regressor
    - gradient_boost   # Gradient Boosting Regressor
  test_size: 0.2
  validation_size: 0.1  # For model selection
  random_state: 42
  metrics: [r2, mae, mse, rmse]
  save_training_curves: true
  save_predictions: true




# -----------------------------
# Paths  (local project directories)
# -----------------------------
paths:
  outputs: 'outputs'
  figures: 'figures'
  models:  'outputs/models'
  reports: 'outputs/reports'
